[package]
name    = "mikella-store-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "mikella-server"
path = "src/main.rs"

[dependencies]
serde             = { workspace = true }
serde_json        = { workspace = true }
tokio             = { workspace = true, features = ["net"] }
axum              = { workspace = true }
tower             = { workspace = true }
tower-http        = { workspace = true }
uuid              = { workspace = true }
chrono            = { workspace = true }
tracing           = { workspace = true }
tracing-subscriber = { workspace = true }
blake3            = { workspace = true }
subtle            = "2"
mikella-shared-kernel    = { path = "../shared-kernel" }
mikella-domain-cash      = { path = "../domain-cash" }
mikella-domain-sales     = { path = "../domain-sales" }
mikella-app-sales        = { path = "../app-sales" }
mikella-app-cash         = { path = "../app-cash" }
mikella-domain-inventory = { path = "../domain-inventory" }
mikella-app-inventory    = { path = "../app-inventory" }
mikella-domain-people    = { path = "../domain-people" }
mikella-app-people       = { path = "../app-people" }
mikella-domain-finance   = { path = "../domain-finance" }
mikella-app-finance      = { path = "../app-finance" }
mikella-infra-sqlite     = { path = "../infra-sqlite" }
mikella-infra-hardware   = { path = "../infra-hardware" }
argon2                = { workspace = true, features = ["password-hash"] }
rand                   = { workspace = true }
rusqlite              = { workspace = true }
# mikella-app-finance (now used for finance endpoints)
