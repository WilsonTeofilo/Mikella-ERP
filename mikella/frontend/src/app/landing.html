<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mikella ERP — Login</title>
  <link rel="stylesheet" href="../shared/design/tokens.css" />
  <link rel="stylesheet" href="../shared/design/fontes.css" />
  <link rel="stylesheet" href="../shared/ui/window-controls.css" />
  <style>
    /* ============================================================
       LANDING — tela de login
       Voz: "Rua" (letreiro) — cobalto dominante, blocos, ângulos.
       Ref: 08_IDENTIDADE_VISUAL_E_UX.md §1, §5.2, §6, §7.1
       VIS-040: zero border-radius em todo o sistema.
       VIS-072: sem sombra difusa (box-shadow só 0px 0px na sólida).
       ============================================================ */

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    body {
      background: var(--azul-600, #0040D8);
      color: var(--branco, #FFFFFF);
      font-family: var(--fonte-display, "Archivo"), "Arial Narrow", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* ─── Elementos angulares de fundo (assinatura visual §7.1) ─── */
    .fundo-angular {
      position: absolute;
      top: -20%;
      right: -10%;
      width: 60%;
      height: 140%;
      background: rgba(255, 255, 255, 0.08);
      transform: rotate(25deg);
      pointer-events: none;
      z-index: 1;
    }

    .fundo-faixa {
      position: absolute;
      bottom: -15%;
      left: -25%;
      width: 80%;
      height: 40%;
      background: var(--azul-700, #0030A8);
      transform: rotate(-15deg);
      pointer-events: none;
      z-index: 1;
    }

    /* ─── Controles da janela (Tauri) — canto superior direito ─── */
    .controles-janela {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      display: flex;
      gap: 0;
    }

    .controle-janela {
      min-width: 48px;
      height: 36px;
      padding: 0 12px;
      border: none;
      border-left: 2px solid rgba(0,0,0,0.3);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-family: var(--fonte-display, "Archivo"), sans-serif;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 80ms;
    }

    .controle-janela:hover {
      background: rgba(0,0,0,0.65);
    }

    .controle-janela--fechar:hover {
      background: var(--vermelho, #C81E16);
    }

    /* ─── Container principal ─── */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 460px;
      padding: 32px 28px 40px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* ─── LETREIRO QUADRICULADO — Estilo Stickers / Bloco de Rua ─── */
    .marca-letreiro-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 32px;
      user-select: none;
    }

    .letreiro-linha {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0px;
      box-shadow: 6px 6px 0px #000000;
    }

    .letra-bloco {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 48px;
      font-family: var(--fonte-display, "Archivo", sans-serif);
      font-size: 1.85rem;
      font-weight: 900;
      line-height: 1;
      text-transform: uppercase;
      border: 3px solid #000000;
      border-right-width: 0;
      box-sizing: border-box;
      transition: transform 80ms ease;
    }

    .letreiro-linha .letra-bloco:last-child {
      border-right-width: 3px;
    }

    /* Alternância de blocos estilo Cartoon Network / Persona */
    .letra-bloco.preta {
      background: #000000;
      color: #FFFFFF;
    }

    .letra-bloco.branca {
      background: #FFFFFF;
      color: #000000;
    }

    .marca-letreiro-grid:hover .letra-bloco {
      transform: translateY(-2px);
    }

    /* ─── Formulário ─── */
    .form-bloco {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .campo-grupo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .campo-label {
      font-family: var(--fonte-display, "Archivo"), sans-serif;
      font-size: 0.85rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      color: #000;
      text-transform: uppercase;
      background: #fff;
      display: inline-block;
      padding: 2px 8px;
      align-self: flex-start;
    }

    .campo-input {
      width: 100%;
      height: 58px;
      background: #fff;
      border: 3px solid #000;
      padding: 0 16px;
      font-family: var(--fonte-texto, "Source Sans 3"), "Segoe UI", sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: #000;
      outline: none;
      /* sombra sólida — estilo letreiro */
      box-shadow: 4px 4px 0 #000;
      transition: transform 80ms, box-shadow 80ms;
    }

    .campo-input:focus {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    /* Disfarça senha sem type=password (anti-autofill do WebView2) */
    .campo-senha-mascarado {
      -webkit-text-security: disc;
      text-security: disc;
    }

    /* ─── Botão entrar ─── */
    .btn-entrar {
      width: 100%;
      min-height: 58px;
      margin-top: 4px;
      background: #000;
      color: #fff;
      border: 3px solid #000;
      font-family: var(--fonte-display, "Archivo"), sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 4px 4px 0 rgba(255,255,255,0.5);
      transition: transform 80ms, background 80ms, color 80ms, box-shadow 80ms;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-entrar:hover:not(:disabled) {
      background: #fff;
      color: #000;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000;
    }

    .btn-entrar:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* ─── Mensagens de feedback ─── */
    .feedback-msg {
      padding: 10px 14px;
      font-family: var(--fonte-texto, "Source Sans 3"), sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border: 2px solid #000;
      width: 100%;
      display: none;
    }

    .feedback-erro {
      background: var(--vermelho, #C81E16);
      color: #fff;
    }

    .feedback-ok {
      background: var(--verde, #07733C);
      color: #fff;
    }

    /* ─── Rodapé ─── */
    .rodape-info {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      font-family: var(--fonte-texto, "Source Sans 3"), sans-serif;
      font-weight: 700;
      color: rgba(0,0,0,0.6);
      white-space: nowrap;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      z-index: 5;
    }

    /* ─── Acessibilidade ─── */
    *:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      .login-container { padding: 24px 16px 32px; }
      .marca-titulo { font-size: clamp(1.8rem, 10vw, 2.5rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body data-tema="rua">
  <!-- Elementos de fundo angulares -->
  <div class="fundo-angular" aria-hidden="true"></div>
  <div class="fundo-faixa" aria-hidden="true"></div>

  <!-- Controles nativos da janela Tauri (canto fixo) -->
  <nav class="controles-janela" aria-label="Controles da janela">
    <button id="btn-fullscreen" class="controle-janela" type="button"
            aria-label="Tela cheia (F11)" title="Tela cheia (F11)">TELA CHEIA</button>
    <button id="btn-minimizar" class="controle-janela" type="button"
            aria-label="Minimizar" title="Minimizar">—</button>
    <button id="btn-fechar" class="controle-janela controle-janela--fechar" type="button"
            aria-label="Fechar" title="Fechar">✕</button>
  </nav>

  <main class="login-container">
    <!-- LETREIRO QUADRICULADO — Estilo Stickers / Bloco de Rua (Cartoon Network / Persona) -->
    <div class="marca-letreiro-grid" aria-label="MIKELLA ERP">
      <div class="letreiro-linha">
        <span class="letra-bloco preta">M</span>
        <span class="letra-bloco branca">I</span>
        <span class="letra-bloco preta">K</span>
        <span class="letra-bloco branca">E</span>
        <span class="letra-bloco preta">L</span>
        <span class="letra-bloco branca">L</span>
        <span class="letra-bloco preta">A</span>
      </div>
      <div class="letreiro-linha" style="margin-top: 4px;">
        <span class="letra-bloco branca">E</span>
        <span class="letra-bloco preta">R</span>
        <span class="letra-bloco branca">P</span>
      </div>
    </div>
    <h1 class="sr-only">Mikella ERP — Sistema de Gestão para Pequeno Comércio</h1>

    <form id="form-login" class="form-bloco" autocomplete="off" onsubmit="return false;">
      <!-- Inputs fantasmas para drenar autofill do Chromium/Edge/WebView2 -->
      <input type="text"     style="display:none!important;" aria-hidden="true" tabindex="-1" autocomplete="false" />
      <input type="password" style="display:none!important;" aria-hidden="true" tabindex="-1" autocomplete="false" />

      <div id="grupo-user" class="campo-grupo">
        <label for="input-user" class="campo-label">USER</label>
        <input
          id="input-user"
          name="mikella_op_user"
          class="campo-input"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          data-lpignore="true"
          data-form-type="other"
          autofocus
          required
        />
      </div>

      <div id="grupo-senha" class="campo-grupo">
        <label id="label-senha" for="input-senha" class="campo-label">SENHA</label>
        <input
          id="input-senha"
          name="mikella_op_pwd"
          class="campo-input campo-senha-mascarado"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          data-lpignore="true"
          data-form-type="other"
          required
        />
      </div>

      <div id="msg-erro" class="feedback-msg feedback-erro" role="alert"></div>
      <div id="msg-ok"   class="feedback-msg feedback-ok"   role="status"></div>

      <button id="btn-submit" class="btn-entrar" type="submit">
        <span id="btn-label">ENTRAR</span>
      </button>
    </form>
  </main>

  <p class="rodape-info">127.0.0.1:47823 · LOCAL FIRST · [ENTER]</p>

  <!-- sr-only helper -->
  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}</style>

  <script type="module">
    const API_URL = (window.MIKELLA_API_URL || "http://127.0.0.1:47823").replace(/\/+$/, "");

    /* ── Controles da janela (Tauri 2 / fallback navegador) ── */
    const tauriWin = () => {
      const api = window.__TAURI__;
      return api?.window?.getCurrentWindow?.()
          || api?.webviewWindow?.getCurrentWebviewWindow?.()
          || null;
    };
    const emDesktop = () => Boolean(window.__TAURI__);

    const btnFS  = document.getElementById("btn-fullscreen");
    const btnMin = document.getElementById("btn-minimizar");
    const btnFch = document.getElementById("btn-fechar");

    btnFS.addEventListener("click", async () => {
      const win = tauriWin();
      if (win) {
        const fs = await win.isFullscreen();
        await win.setFullscreen(!fs);
      } else if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    });

    btnMin.addEventListener("click", async () => {
      const win = tauriWin();
      if (win) {
        await win.minimize();
      } else {
        mostrarErro("Minimizar ativo na versão desktop nativa.");
      }
    });

    btnFch.addEventListener("click", async () => {
      const win = tauriWin();
      if (win) {
        await win.close();
      } else if (confirm("Deseja realmente sair do Mikella ERP?")) {
        window.close();
      }
    });

    // Mantém botões sempre visíveis para controle ergonômico
    btnMin.hidden = false;
    btnFch.hidden = false;

    // Atualiza label do botão de tela cheia
    const syncFullscreenState = () => {
      const fs = Boolean(document.fullscreenElement);
      btnFS.textContent = fs ? "SAIR TELA CHEIA" : "TELA CHEIA";
      btnFS.setAttribute("aria-label", fs ? "Sair da tela cheia" : "Abrir tela cheia (F11)");
    };
    document.addEventListener("fullscreenchange", syncFullscreenState);
    syncFullscreenState();

    /* ── Formulário de login / 2FA ── */
    const form       = document.getElementById("form-login");
    const inputUser  = document.getElementById("input-user");
    const inputSenha = document.getElementById("input-senha");
    const labelSenha = document.getElementById("label-senha");
    const grupoUser  = document.getElementById("grupo-user");
    const btnSubmit  = document.getElementById("btn-submit");
    const btnLabel   = document.getElementById("btn-label");
    const msgErro    = document.getElementById("msg-erro");
    const msgOk      = document.getElementById("msg-ok");

    let etapa = "login"; // "login" | "2fa"
    let usernameSalvo = "";

    function mostrarErro(texto) {
      msgErro.textContent = texto;
      msgErro.style.display = "block";
      msgOk.style.display   = "none";
    }

    function mostrarOk(texto) {
      msgOk.textContent  = texto;
      msgOk.style.display   = "block";
      msgErro.style.display = "none";
    }

    function limparMsgs() {
      msgErro.style.display = "none";
      msgOk.style.display   = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      limparMsgs();

      if (etapa === "login") {
        const username = inputUser.value.trim();
        const senha    = inputSenha.value;

        if (!username || !senha) {
          mostrarErro("Preencha USER e SENHA.");
          return;
        }

        btnSubmit.disabled = true;
        btnLabel.textContent = "VERIFICANDO...";

        try {
          const body = new URLSearchParams();
          body.append("username", username);
          body.append("senha", senha);

          const res  = await fetch(`${API_URL}/v1/login`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body.toString(),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.token_pending) {
            usernameSalvo = data.username || username;
            etapa = "2fa";
            grupoUser.style.display = "none";
            labelSenha.textContent = "CÓDIGO 2FA";
            inputSenha.classList.remove("campo-senha-mascarado");
            inputSenha.maxLength = 6;
            inputSenha.placeholder = "000000";
            btnLabel.textContent = "VERIFICAR (ENTER)";

            inputSenha.value = "";
            if (data.codigo_debug) {
              mostrarOk(`Código 2FA: ${data.codigo_debug} — digite acima.`);
            } else {
              mostrarOk("Código enviado. Digite os 6 dígitos.");
            }
            inputSenha.focus();
          } else {
            mostrarErro(data.erro || "Usuário ou senha incorretos.");
          }
        } catch {
          mostrarErro("Servidor não responde em 127.0.0.1:47823.");
        } finally {
          btnSubmit.disabled = false;
          if (etapa === "login") btnLabel.textContent = "ENTRAR";
        }

      } else if (etapa === "2fa") {
        const codigo = inputSenha.value.trim();
        if (codigo.length < 6) {
          mostrarErro("Digite o código de 6 dígitos.");
          return;
        }

        btnSubmit.disabled = true;
        btnLabel.textContent = "VALIDANDO...";

        try {
          const body = new URLSearchParams();
          body.append("username", usernameSalvo);
          body.append("codigo", codigo);

          const res  = await fetch(`${API_URL}/v1/2fa/verificar`, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body.toString(),
          });

          const data = await res.json().catch(() => ({}));

          if (res.ok && data.token) {
            localStorage.setItem("mikella_token", data.token);
            if (data.usuario) {
              localStorage.setItem("mikella_usuario", JSON.stringify(data.usuario));
            }
            mostrarOk("Acesso autorizado!");
            setTimeout(() => { window.location.href = "main-menu.html"; }, 350);
          } else {
            mostrarErro(data.erro || "Código inválido ou expirado.");
            btnSubmit.disabled = false;
            btnLabel.textContent = "VERIFICAR (ENTER)";
          }
        } catch {
          mostrarErro("Falha de conexão com a API local.");
          btnSubmit.disabled = false;
          btnLabel.textContent = "VERIFICAR (ENTER)";
        }
      }
    });

    /* ── Atalhos de teclado ── */
    window.addEventListener("keydown", (e) => {
      // F11 → toggle tela cheia
      if (e.key === "F11") {
        e.preventDefault();
        btnFS.click();
      }
      // ESC na etapa 2FA → volta ao login
      if (e.key === "Escape" && etapa === "2fa") {
        etapa = "login";
        grupoUser.style.display = "flex";
        labelSenha.textContent = "SENHA";
        inputSenha.classList.add("campo-senha-mascarado");
        inputSenha.placeholder = "";
        inputSenha.removeAttribute("maxlength");
        inputSenha.value = "";
        btnLabel.textContent = "ENTRAR";
        limparMsgs();
        inputUser.focus();
      }
    });
  </script>
</body>
</html>
