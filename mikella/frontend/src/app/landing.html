<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mikella ERP — Login</title>
  <link rel="stylesheet" href="../shared/design/tokens.css" />
  <link rel="stylesheet" href="../shared/design/fontes.css" />
  <link rel="stylesheet" href="../shared/ui/window-controls.css" />
  <link rel="stylesheet" href="../features/auth/login.css" />
</head>
<body data-tema="rua">
  <!-- Elementos de fundo angulares -->
  <div class="fundo-angular" aria-hidden="true"></div>
  <div class="fundo-faixa" aria-hidden="true"></div>

  <main class="login-container">
    <!-- LETREIRO QUADRICULADO — Estilo Stickers / Bloco de Rua (Cartoon Network / Persona) -->
    <div class="marca-letreiro-grid" aria-label="MIKELLA ERP">
      <div class="letreiro-linha">
        <span class="letra-bloco preta">M</span>
        <span class="letra-bloco branca">I</span>
        <span class="letra-bloco preta">K</span>
        <span class="letra-bloco branca">E</span>
        <span class="letra-bloco preta">L</span>
        <span class="letra-bloco branca">L</span>
        <span class="letra-bloco preta">A</span>
      </div>
      <div class="letreiro-linha" style="margin-top: 4px;">
        <span class="letra-bloco branca">E</span>
        <span class="letra-bloco preta">R</span>
        <span class="letra-bloco branca">P</span>
      </div>
    </div>
    <h1 class="sr-only">Mikella ERP — Sistema de Gestão para Pequeno Comércio</h1>

    <form id="form-login" class="form-bloco" autocomplete="off" novalidate>
      <!-- Inputs fantasmas para drenar autofill do Chromium/Edge/WebView2 -->
      <input type="text"     style="display:none!important;" aria-hidden="true" tabindex="-1" autocomplete="false" />
      <input type="password" style="display:none!important;" aria-hidden="true" tabindex="-1" autocomplete="false" />

      <div id="grupo-user" class="campo-grupo">
        <label for="input-user" class="campo-label">USER</label>
        <input
          id="input-user"
          name="mikella_op_user"
          class="campo-input"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          data-lpignore="true"
          data-form-type="other"
          autofocus
          required
        />
      </div>

      <div id="grupo-senha" class="campo-grupo">
        <label id="label-senha" for="input-senha" class="campo-label">SENHA</label>
        <input
          id="input-senha"
          name="mikella_op_pwd"
          class="campo-input campo-senha-mascarado"
          type="text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          data-lpignore="true"
          data-form-type="other"
          required
        />
      </div>

      <div id="msg-erro" class="feedback-msg feedback-erro" role="alert"></div>
      <div id="msg-ok"   class="feedback-msg feedback-ok"   role="status"></div>

      <button id="btn-submit" class="btn-entrar" type="submit">
        <span id="btn-label">ENTRAR</span>
      </button>
    </form>
  </main>

  <p class="rodape-info">127.0.0.1:47823 · LOCAL FIRST · [ENTER]</p>

  <script type="module" src="../features/auth/login.js"></script>
</body>
</html>
