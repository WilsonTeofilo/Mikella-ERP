<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mikella ERP — Menu Principal</title>
  <!--
    Menu Principal — Estilo Persona 3 Reload.
    - Fundo azul profundo com atmosfera oceânica e corte diagonal branco
    - Menu dinâmico em ângulo (skew/rotate)
    - Item ativo destacado em bloco angular de alto impacto
    - Filtragem estrita por papel (DONO, GERENTE, OPERADOR_CAIXA, ESTOQUISTA, VENDEDOR)
    - Navegação 100% via teclado (W/S, Setas, Enter, Esc)
  -->
  <link rel="stylesheet" href="../shared/design/tokens.css" />
  <link rel="stylesheet" href="../shared/design/fontes.css" />
  <link rel="stylesheet" href="../shared/ui/window-controls.css" />
  <link rel="stylesheet" href="../features/navigation/main-menu.css" />
  <link rel="stylesheet" href="../shared/ui/forms.css" />
  <link rel="stylesheet" href="../shared/ui/diagnostico.css" />
  <link rel="stylesheet" href="../shared/design/utilitarios.css" />
</head>
<body>
  <div class="p3-faixa-sombra"></div>
  <div class="p3-faixa-branca"></div>
  <div class="p3-silhueta-letreiro">MIKELLA<br>SYSTEM</div>

  <!-- HUD Superior Esquerdo: Caixa / Saldo -->
  <div class="hud-carteira">
    <div class="hud-carteira-label">Terminal Local</div>
    <div id="hud-caixa-status" class="hud-carteira-valor">MIKELLA POS</div>
  </div>

  <!-- HUD Superior Direito: Perfil do Jogador / Operador -->
  <div class="hud-perfil">
    <div class="hud-perfil-info">
      <div id="usuario-nome" class="hud-perfil-nome">CARREGANDO...</div>
      <div id="usuario-papel" class="hud-perfil-papel">AUTH</div>
    </div>
  </div>

  <!-- Lista de Menu Diagonal Persona 3 Reload -->
  <main class="p3-menu-container">
    <nav class="p3-menu-lista" id="menu-lista">
      <!-- Itens gerados dinamicamente com base nas permissões -->
    </nav>
  </main>

  <!-- HUD Inferior Direito: Comandos de Jogo -->
  <footer class="hud-comandos">
    <div class="hud-cmd-item">
      <span class="hud-btn-tag">W / S / ↑↓</span> Navegar
    </div>
    <div class="hud-cmd-item">
      <span class="hud-btn-tag">ENTER</span> Selecionar
    </div>
    <div class="hud-cmd-item">
      <span class="hud-btn-tag">ESC</span> Desconectar
    </div>
    <div class="hud-cmd-item">
      <span class="hud-btn-tag">F10</span> Diagnóstico
    </div>
  </footer>

  <!-- Toast de Notificação -->
  <div id="toast"></div>

  <!-- Modal de Confirmação de Ação (Backup) -->
  <div id="modal-acao" class="modal-dialogo u-5790ffba">
    <div class="modal-box">
      <h2 id="modal-titulo">CONFIRMAÇÃO</h2>
      <p id="modal-descricao">Deseja executar esta ação?</p>
      <div class="modal-botoes">
        <button id="modal-btn-confirmar" class="modal-btn modal-btn-confirm">EXECUTAR</button>
        <button id="modal-btn-cancelar" class="modal-btn modal-btn-cancel">VOLTAR (ESC)</button>
      </div>
    </div>
  </div>


<script type="module" src="../features/navigation/main-menu.js"></script>
</body>
</html>
