<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mikella ERP — Produtos</title>
  <link rel="stylesheet" href="../shared/design/tokens.css" />
  <link rel="stylesheet" href="../shared/design/fontes.css" />
  <link rel="stylesheet" href="../shared/ui/forms.css" />
  <link rel="stylesheet" href="../shared/ui/window-controls.css" />
  <link rel="stylesheet" href="../shared/ui/diagnostico.css" />
  <link rel="stylesheet" href="../features/products/products.css" />
  <link rel="stylesheet" href="../shared/design/utilitarios.css" />
</head>
<body data-tema="caixa">
    <!-- Barra de Topo Unificada -->
  <header class="u-a152f58d">
    <div class="u-b264e9d1">
      <span class="u-a7d0a29f">MIKELLA <span class="u-aea9ed03">ESTOQUE & PRODUTOS</span></span>
    </div>
    <div>
      <button id="btn-topo-voltar" type="button" class="botao u-21f497f9" >
        [ESC] Voltar ao Menu
      </button>
    </div>
  </header>

  <main class="app-container">
    <div class="linha-topo">
      <div>
        <h1 class="titulo-pagina">Catálogo de Produtos</h1>
        <p class="u-ef86c155">Cadastro local, controle de estoque e importação de planilhas</p>
      </div>
      <div class="busca-box">
        <label class="u-3abfc521" for="filtro-busca">Filtrar produtos</label>
        <input id="filtro-busca" type="text" placeholder="digite nome ou código..." autocomplete="off" autofocus />
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Código / SKU</th>
          <th>Un</th>
          <th class="direita">Preço de Venda</th>
          <th class="direita">Estoque</th>
          <th class="direita">Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-produtos-corpo">
        <tr><td class="u-65f9d5a3" colspan="6">Carregando produtos...</td></tr>
      </tbody>
    </table>

    <div class="barra-botoes">
      <button id="btn-novo" class="botao primario"><span class="tecla">F1</span> Novo Produto</button>
      <button id="btn-csv" class="botao"><span class="tecla">F2</span> Importar Planilha CSV</button>
      <input class="u-5790ffba" type="file" id="input-csv-file" accept=".csv" />
      <button id="btn-voltar" class="botao"><span class="tecla">Esc</span> Voltar ao Menu</button>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Modal: Cadastrar Produto -->
  <div id="modal-produto" class="modal u-5790ffba">
    <div class="modal-conteudo">
      <h2 class="modal-titulo">Novo Produto</h2>
      <form id="form-produto" autocomplete="off">
        <div class="u-4a76da36">
          <div class="campo-grupo u-409b3c5d">
            <label for="prod-barras">Cód. Barras (Leitor / EAN-13)</label>
            <input id="prod-barras" type="text" placeholder="Bipe ou digite o código..." autocomplete="off" autofocus />
          </div>
          <div class="campo-grupo u-634a28be">
            <label for="prod-sku">SKU / Cód. Interno</label>
            <input id="prod-sku" type="text" placeholder="Código interno" autocomplete="off" />
          </div>
        </div>

        <div class="campo-grupo">
          <label for="prod-nome">Nome do Produto *</label>
          <input id="prod-nome" type="text" required placeholder="Ex: Arroz Tipo 1 5kg" autocomplete="off" />
        </div>

        <div class="u-4a76da36">
          <div class="campo-grupo u-634a28be">
            <label for="prod-unidade">Unidade</label>
            <select id="prod-unidade">
              <option value="UN">UN (Unidade)</option>
              <option value="KG">KG (Quilograma)</option>
              <option value="L">L (Litro)</option>
              <option value="PCT">PCT (Pacote)</option>
              <option value="CX">CX (Caixa)</option>
            </select>
          </div>
          <div class="campo-grupo u-634a28be">
            <label for="prod-custo">Preço de Custo (R$)</label>
            <input class="u-30489cbd" id="prod-custo" type="text" placeholder="0,00" autocomplete="off" />
          </div>
        </div>

        <div class="campo-grupo">
          <div class="u-706b7758">
            <label for="prod-preco">Preço de Venda (R$) *</label>
            <span class="u-cda281b9" id="prod-margem-preview">Margem: --</span>
          </div>
          <input class="u-30489cbd" id="prod-preco" type="text" required placeholder="0,00" autocomplete="off" />
        </div>

        <div class="u-4a76da36">
          <div class="campo-grupo u-634a28be">
            <label for="prod-qtd-inicial">Qtd. Entrada (Estoque Atual)</label>
            <input id="prod-qtd-inicial" type="number" value="0" min="0" autocomplete="off" />
          </div>
          <div class="campo-grupo u-634a28be">
            <label for="prod-estoque-min">Estoque Mínimo (Alerta)</label>
            <input id="prod-estoque-min" type="number" value="0" min="0" autocomplete="off" />
          </div>
        </div>

        <div class="u-a8d69778">
          <button type="submit" class="botao primario u-634a28be">Salvar Produto</button>
          <button type="button" id="btn-cancelar-modal" class="botao u-634a28be">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

<script type="module" src="../features/products/products.js"></script>
</body>
</html>
