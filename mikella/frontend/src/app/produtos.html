<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mikella ERP — Produtos</title>
  <link rel="stylesheet" href="../shared/design/tokens.css" />
  <link rel="stylesheet" href="../shared/design/fontes.css" />
  <link rel="stylesheet" href="../shared/ui/forms.css" />
  <link rel="stylesheet" href="../shared/ui/window-controls.css" />
  <link rel="stylesheet" href="../features/products/products.css" />
</head>
<body data-tema="caixa">
    <!-- Barra de Topo Unificada -->
  <header style="background: #000; color: #FFF; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #0040D8;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-family: var(--fonte-display); font-size: 1.3rem; font-weight: 900; letter-spacing: 1px; color: #FFF;">MIKELLA <span style="background: #0040D8; padding: 2px 6px; font-size: 0.8rem;">ESTOQUE & PRODUTOS</span></span>
    </div>
    <div>
      <button id="btn-topo-voltar" type="button" class="botao" style="background: #FFF; color: #000; font-weight: 800; font-size: 0.85rem; padding: 4px 12px; height: 32px;" >
        [ESC] Voltar ao Menu
      </button>
    </div>
  </header>

  <main class="app-container">
    <div class="linha-topo">
      <div>
        <h1 class="titulo-pagina">Catálogo de Produtos</h1>
        <p style="margin:var(--espaco-1) 0 0 0; color:#555;">Cadastro local, controle de estoque e importação de planilhas</p>
      </div>
      <div class="busca-box">
        <label for="filtro-busca" style="display:block; font-size:0.85rem; font-weight:bold;">Filtrar produtos</label>
        <input id="filtro-busca" type="text" placeholder="digite nome ou código..." autocomplete="off" autofocus />
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Código / SKU</th>
          <th>Un</th>
          <th class="direita">Preço de Venda</th>
          <th class="direita">Estoque</th>
          <th class="direita">Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-produtos-corpo">
        <tr><td colspan="6" style="text-align:center;">Carregando produtos...</td></tr>
      </tbody>
    </table>

    <div class="barra-botoes">
      <button id="btn-novo" class="botao primario"><span class="tecla">F1</span> Novo Produto</button>
      <button id="btn-csv" class="botao"><span class="tecla">F2</span> Importar Planilha CSV</button>
      <input type="file" id="input-csv-file" accept=".csv" style="display:none;" />
      <button id="btn-voltar" class="botao"><span class="tecla">Esc</span> Voltar ao Menu</button>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <!-- Modal: Cadastrar Produto -->
  <div id="modal-produto" class="modal" style="display:none;">
    <div class="modal-conteudo">
      <h2 class="modal-titulo">Novo Produto</h2>
      <form id="form-produto" autocomplete="off">
        <div style="display:flex; gap:var(--espaco-2);">
          <div class="campo-grupo" style="flex:1.5;">
            <label for="prod-barras">Cód. Barras (Leitor / EAN-13)</label>
            <input id="prod-barras" type="text" placeholder="Bipe ou digite o código..." autocomplete="off" autofocus />
          </div>
          <div class="campo-grupo" style="flex:1;">
            <label for="prod-sku">SKU / Cód. Interno</label>
            <input id="prod-sku" type="text" placeholder="Código interno" autocomplete="off" />
          </div>
        </div>

        <div class="campo-grupo">
          <label for="prod-nome">Nome do Produto *</label>
          <input id="prod-nome" type="text" required placeholder="Ex: Arroz Tipo 1 5kg" autocomplete="off" />
        </div>

        <div style="display:flex; gap:var(--espaco-2);">
          <div class="campo-grupo" style="flex:1;">
            <label for="prod-unidade">Unidade</label>
            <select id="prod-unidade">
              <option value="UN">UN (Unidade)</option>
              <option value="KG">KG (Quilograma)</option>
              <option value="L">L (Litro)</option>
              <option value="PCT">PCT (Pacote)</option>
              <option value="CX">CX (Caixa)</option>
            </select>
          </div>
          <div class="campo-grupo" style="flex:1;">
            <label for="prod-custo">Preço de Custo (R$)</label>
            <input id="prod-custo" type="text" placeholder="0,00" style="text-align:right;" autocomplete="off" />
          </div>
        </div>

        <div class="campo-grupo">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label for="prod-preco">Preço de Venda (R$) *</label>
            <span id="prod-margem-preview" style="font-size: 0.85rem; font-weight: bold; color: #0040D8;">Margem: --</span>
          </div>
          <input id="prod-preco" type="text" required placeholder="0,00" style="text-align:right;" autocomplete="off" />
        </div>

        <div style="display:flex; gap:var(--espaco-2);">
          <div class="campo-grupo" style="flex:1;">
            <label for="prod-qtd-inicial">Qtd. Entrada (Estoque Atual)</label>
            <input id="prod-qtd-inicial" type="number" value="0" min="0" autocomplete="off" />
          </div>
          <div class="campo-grupo" style="flex:1;">
            <label for="prod-estoque-min">Estoque Mínimo (Alerta)</label>
            <input id="prod-estoque-min" type="number" value="0" min="0" autocomplete="off" />
          </div>
        </div>

        <div style="margin-top:var(--espaco-4); display:flex; gap:var(--espaco-2);">
          <button type="submit" class="botao primario" style="flex:1;">Salvar Produto</button>
          <button type="button" id="btn-cancelar-modal" class="botao" style="flex:1;">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

<script type="module" src="../features/products/products.js"></script>
</body>
</html>
